<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revive Rewards</title>
<link rel="icon" type="image/png" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#f7941d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f1; --card:#ffffff; --ink:#1c1a18; --muted:#6e6760; --line:#ece4da;
  --pri:#c9501b; --pri-2:#ef7a22; --pri-soft:#fdece0; --gold:#f7941d; --gold-soft:#fef1df; --gold-ink:#9a4c00;
  --red:#b4442f; --red-soft:#f8e4df; --ok:#2f7a4f; --ok-soft:#e3f2e8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04); --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#171412; --card:#221d1a; --ink:#f1ece6; --muted:#a69d94; --line:#352d27;
    --pri:#ff9a5c; --pri-2:#ffb27f; --pri-soft:#3a2518; --gold:#f7a13a; --gold-soft:#3a2a17; --gold-ink:#f7a13a;
    --red:#ee8a74; --red-soft:#3b231e; --ok:#7cc79a; --ok-soft:#1d3326; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Sorts Mill Goudy",Georgia,serif;font-weight:400;margin:0;line-height:1.2}
a{color:var(--pri)}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--gold);box-shadow:0 1px 8px rgba(0,0,0,.05)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Sorts Mill Goudy",Georgia,serif;font-size:26px;text-decoration:none;color:var(--ink)}
.brand img{height:36px;width:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;padding:7px 12px;border-radius:999px;opacity:.8;font-weight:500}
nav a:hover{opacity:1;background:var(--pri-soft)}
nav a.on{opacity:1;background:var(--pri-soft);color:var(--pri)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{background:var(--gold);color:#2b1400;border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap;border:0;cursor:pointer}
.menu{position:relative}
.menu>button{border:0;background:none;cursor:pointer;padding:2px;border-radius:50%}
.menu .dd{right:0;left:auto;min-width:220px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:880px){ .grid{grid-template-columns:1fr} }
@media (max-width:600px){ .top{position:static} .top-in{gap:8px} .me{margin-left:0} .wrap{padding:14px 12px 50px} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px} .wrapf{flex-wrap:wrap} .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--pri-2)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme: dark){ .btn.primary{color:#1a0d05} }
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1400}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;padding:6px 10px}
.btn.ghost:hover{background:var(--pri-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{width:100%;text-align:center;padding:11px}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;outline:none}
.input:focus{border-color:var(--pri-2);box-shadow:0 0 0 3px var(--pri-soft)}
textarea.input{resize:vertical;min-height:80px}
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:0 0 5px}
.fld{margin-top:12px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;letter-spacing:.3px}
.av.sm{width:28px;height:28px;font-size:11px} .av.xs{width:22px;height:22px;font-size:9px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;background:var(--pri-soft);color:var(--pri)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)} .chip.red{background:var(--red-soft);color:var(--red)}
.chip.grey{background:var(--line);color:var(--muted)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip button{border:0;background:none;cursor:pointer;padding:0 0 0 2px;color:inherit;font-size:15px;line-height:1}
.picker{position:relative}
.picker .box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;min-height:42px;cursor:text}
.picker .box:focus-within{border-color:var(--pri-2);box-shadow:0 0 0 3px var(--pri-soft)}
.picker input{border:0;outline:none;background:transparent;flex:1;min-width:140px;padding:4px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:auto;max-height:320px}
.dd>div,.dd>button{padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.dd>div:hover,.dd>div.hi,.dd>button:hover{background:var(--pri-soft)}
.dd .none{cursor:default;color:var(--muted)}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.vals button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.vals button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.preview{position:relative;margin-top:10px;display:inline-block}
.preview img{max-height:160px;border-radius:10px;display:block}
.preview button{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){ .two{grid-template-columns:1fr} }
.post{margin-top:16px}
.post .head{display:flex;gap:12px;align-items:flex-start}
.post .text{white-space:pre-wrap;word-wrap:break-word;margin:10px 0 4px;font-size:16px}
.post .photo{margin-top:10px;border-radius:12px;max-width:100%;max-height:520px;display:block;cursor:zoom-in;background:var(--line);min-height:80px}
.post.award{border-color:var(--gold)}
.post.award .ribbon{background:var(--gold-soft);color:var(--gold-ink);border-radius:var(--radius) var(--radius) 0 0;padding:7px 18px;font-weight:700;font-size:13px;letter-spacing:.3px}
.actions{display:flex;gap:4px;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.like.on{color:var(--red)}
.likers{font-size:13px;color:var(--muted);margin-top:4px}
.comments{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.cmt{display:flex;gap:8px;align-items:flex-start}
.cmt .bub{background:var(--bg);border-radius:12px;padding:7px 12px;flex:1;min-width:0}
.cmt .bub b{font-size:13px}
.cmt .bub div{white-space:pre-wrap;word-wrap:break-word}
.cmt .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px}
.addc{display:flex;gap:8px;margin-top:10px;align-items:center}
.addc input{flex:1}
.side .card{margin-bottom:16px}
.big{font-family:"Sorts Mill Goudy",Georgia,serif;font-size:42px;line-height:1;color:var(--pri)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.lb{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.lb .n{width:20px;text-align:center;font-weight:700;color:var(--muted)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.reward{display:flex;flex-direction:column;overflow:hidden}
.reward .art{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,var(--pri-soft),var(--gold-soft))}
.reward .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.reward .cost{font-weight:700;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.off td{opacity:.55}
.plus{color:var(--ok);font-weight:700} .minus{color:var(--red);font-weight:700}
.sec{margin-top:22px}
.sec>h2{font-size:22px;margin-bottom:10px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.subnav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.subnav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.subnav .count{background:var(--gold);color:#2b1400;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.banner{padding:10px 14px;border-radius:12px;margin-bottom:14px;background:var(--gold-soft);color:var(--gold-ink)}
.banner.err{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.auth{max-width:400px;margin:8vh auto 40px;padding:28px}
.auth .logo{display:block;max-width:240px;width:100%;margin:0 auto 6px}
.auth h1{text-align:center;font-size:30px;margin:8px 0 2px}
.auth .err{color:var(--red);font-size:14px;margin-top:10px;min-height:1em}
.creds{background:var(--bg);border:1px dashed var(--pri-2);border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:14px;white-space:pre-wrap;margin:12px 0}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,8,6,.55);padding:18px}
#modal.on{display:flex}
#modal>.card{max-width:460px;width:100%;padding:22px;max-height:92vh;overflow:auto}
#modal>.card.wide{max-width:960px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.on{border-color:var(--pri-2);background:var(--pri-soft)}
.st{font-size:16px;width:22px;text-align:center}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog>i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
#modal img.full{max-width:92vw;max-height:88vh;border-radius:12px;display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;font-weight:500;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.hidden{display:none !important}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.emo{width:64px;text-align:center}
.search{max-width:280px}
</style>
</head>
<body>
<header class="top hidden" id="top">
  <div class="top-in">
    <a class="brand" href="#feed"><img src="assets/rmark.png" alt="Revive Health"><span id="brandName">Revive Rewards</span></a>
    <nav id="nav">
      <a href="#feed" data-v="feed">Feed</a>
      <a href="#rewards" data-v="rewards">Rewards</a>
      <a href="#wallet" data-v="wallet">My points</a>
      <a href="#admin" data-v="admin" class="hidden" id="navAdmin">Admin</a>
    </nav>
    <div class="me">
      <button class="pill" id="pill" title="Your points balance"></button>
      <div class="menu" id="menu"></div>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* =================== helpers =================== */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false || c === "") continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const $ = s => document.querySelector(s);
const EMAIL_DOMAIN = "staff.reviverewards.internal";
const fmtPts = n => (Number(n)||0).toLocaleString() + " pts";
function money(points){ const v = (Number(points)||0) * S.settings.point_value_cents / 100; return "$" + (Number.isInteger(v) ? v.toLocaleString() : v.toFixed(2)); }
function ago(t){
  const ms = typeof t === "number" ? t : Date.parse(t); const s = Math.max(0,(Date.now()-ms)/1000);
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago"; if (s < 604800) return Math.floor(s/86400) + "d ago";
  const d = new Date(ms); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year: d.getFullYear()===new Date().getFullYear()?undefined:"numeric"});
}
const dateStr = t => new Date(t).toLocaleDateString();
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),3200); }
function errText(e){
  const m = (e && (e.message || e.error_description)) || String(e || "");
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Can't reach the server. Check your internet connection.";
  if (/JWT expired|invalid JWT/i.test(m)) return "Your session expired. Please sign in again.";
  return m || "Something went wrong. Please try again.";
}
async function q(promise){ const { data, error } = await promise; if (error) throw error; return data; }
function modal(content, onClose){
  const m = $("#modal"); m.replaceChildren(content); m.classList.add("on");
  m.onclick = e => { if (e.target === m){ closeModal(); onClose && onClose(); } };
}
function closeModal(){ const m=$("#modal"); m.classList.remove("on"); m.replaceChildren(); }
function busy(btn, label){ btn.disabled = true; btn._label = btn.textContent; btn.replaceChildren(h("span",{class:"spinner"}), " " + (label || "Working…")); }
function unbusy(btn){ btn.disabled = false; btn.textContent = btn._label || btn.textContent; }
function confirmBox(title, body, okLabel, onOk, danger){
  const ok = h("button",{class:"btn " + (danger ? "danger" : "primary"),text:okLabel});
  modal(h("div",{class:"card"},
    h("h3",{text:title,style:"font-size:22px;margin-bottom:8px"}),
    h("div",{class:"muted",style:"margin-bottom:18px"}, body),
    h("div",{class:"row",style:"justify-content:flex-end"}, h("button",{class:"btn",text:"Cancel",onclick:closeModal}), ok)));
  ok.onclick = async () => { busy(ok); try { await onOk(); closeModal(); } catch(e){ console.error(e); unbusy(ok); toast(errText(e)); } };
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch(e){ const ta = h("textarea",{value:text,style:"position:fixed;opacity:0"}); document.body.append(ta); ta.select(); try{ document.execCommand("copy"); toast("Copied"); }catch(_){ toast("Couldn't copy"); } ta.remove(); }
}
function tempPassword(){
  const words = ["Maple","River","Cedar","Summit","Aspen","Harbor","Meadow","Willow","Canyon","Sierra","Juniper","Falcon"];
  const a = new Uint32Array(2); crypto.getRandomValues(a);
  return words[a[0] % words.length] + "-" + String(1000 + a[1] % 9000);
}
function usernameFrom(name){
  return name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 .-]/g,"").trim().replace(/\s+/g,".").replace(/\.+/g,".").slice(0,40);
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const bdayText = p => p.birth_month ? MONTHS[p.birth_month-1].slice(0,3) + " " + p.birth_day : "";
const hireText = p => p.hire_date ? new Date(p.hire_date + "T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
// birthdays and work anniversaries in the next `days` days (today first)
function upcomingCelebrations(days){
  const today = new Date(); today.setHours(0,0,0,0);
  const out = [];
  const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
  for (const p of S.people.values()){
    if (!p.active) continue;
    const add = (m, d, kind, years) => {
      for (const y of [today.getFullYear(), today.getFullYear()+1]){
        let dd = d; if (m === 2 && d === 29 && !isLeap(y)) dd = 28;
        const when = new Date(y, m-1, dd);
        const diff = Math.round((when - today) / 86400000);
        if (diff >= 0 && diff <= days){ const yrs = years ? y - years : 0; if (kind === "bday" || yrs >= 1) out.push({ p, kind, when, diff, yrs }); break; }
      }
    };
    if (p.birth_month && p.birth_day) add(p.birth_month, p.birth_day, "bday");
    if (p.hire_date){ const [hy, hm, hd] = p.hire_date.split("-").map(Number); add(hm, hd, "anniv", hy); }
  }
  return out.sort((a,b) => a.diff - b.diff || a.p.full_name.localeCompare(b.p.full_name));
}
const COLORS = ["#c9501b","#e07b1c","#b8721a","#8a5a3c","#2f7a6b","#3c6e9e","#7a4f9a","#a8445e","#5b7a2f","#3f5f7a"];
function colorFor(id){ let h0 = 0; for (const c of String(id)) h0 = (h0*31 + c.charCodeAt(0)) >>> 0; return COLORS[h0 % COLORS.length]; }

/* =================== state =================== */
const C = window.REVIVE_CONFIG || {};
let sb = null;
const S = {
  session:null, me:null, view:"feed", adminTab:"requests",
  settings:{ program_name:"Revive Rewards", point_value_cents:10, core_values:[], facilities:[] },
  people:new Map(), rewards:[], posts:[], hasMore:false, likes:new Map(), comments:new Map(), grants:new Map(), month:[], monthGrants:[],
  mine:{received:0, redeemed:0, balance:0}, myReds:[], myHistory:[], urls:new Map(), needsPoints:false,
  admin:{ reds:[], summary:new Map() }, facilityFilter:"", loaded:false
};
const SYSTEM = { id:null, full_name:"Revive Rewards", title:"", facility:"", active:false, system:true };
const P = id => id == null ? SYSTEM : (S.people.get(id) || { id, full_name:"Former employee", title:"", facility:"", active:false });
function avatar(id, cls="av"){
  if (id == null) return h("img",{class:cls, src:"assets/rmark.png", alt:"Revive Rewards", style:"object-fit:contain;background:var(--gold-soft);padding:4px"});
  const p = P(id); const ini = (p.full_name||"?").split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return h("span",{class:cls, style:"background:" + colorFor(id), title:p.full_name, text:ini});
}
function nameList(list, max=3){
  const out = []; const shown = list.slice(0, max);
  shown.forEach((id,i) => { if (i) out.push(i === shown.length-1 && list.length <= max ? " and " : ", "); out.push(h("b",{text:P(id).full_name})); });
  if (list.length > max) out.push(" and " + (list.length-max) + " other" + (list.length-max===1?"":"s"));
  return out;
}

/* =================== boot / auth =================== */
function app(){ return $("#app"); }
function showShell(on){ $("#top").classList.toggle("hidden", !on); }

async function boot(){
  if (!C.supabaseUrl || /PASTE/.test(C.supabaseUrl) || !C.supabaseKey || /PASTE/.test(C.supabaseKey)){
    showShell(false);
    app().replaceChildren(h("div",{class:"card auth"},
      h("img",{class:"logo",src:"assets/revive-logo.png",alt:"Revive Health"}),
      h("h1",{text:"Almost there"}),
      h("p",{class:"muted",style:"text-align:center",text:"This site isn't connected to its database yet. Open config.js in the GitHub repository and paste in your Supabase Project URL and publishable key."})));
    return;
  }
  if (!window.supabase){ showShell(false); app().replaceChildren(h("div",{class:"card auth"}, h("h1",{text:"Can't load"}), h("p",{class:"muted",text:"A required file didn't load. Check your internet connection and refresh the page."}))); return; }
  sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth:{ persistSession:true, autoRefreshToken:true } });
  sb.auth.onAuthStateChange((evt, session) => {
    if (evt === "SIGNED_OUT"){ S.session = null; S.me = null; S.loaded = false; showLogin(); }
    else if (session) S.session = session;

function showLogin(msg){
  showShell(false);
  const user = h("input",{class:"input",autocomplete:"username",autocapitalize:"none",spellcheck:"false",placeholder:"e.g. maria.lopez"});
  const pass = h("input",{class:"input",type:"password",autocomplete:"current-password"});

  const form = h("form",{},
    h("div",{class:"fld"}, h("label",{class:"f",text:"Username"}), user),
    h("div",{class:"fld"}, h("label",{class:"f",text:"Password"}), pass),
    h("div",{style:"margin-top:18px"}, go), err,
    h("p",{class:"small muted",style:"text-align:center;margin-top:16px",text:"Forgot your password or need an account? Ask your administrator."}));
  form.onsubmit = async e => {
    e.preventDefault(); err.textContent = "";
    const u = user.value.trim().toLowerCase();
    if (!u || !pass.value){ err.textContent = "Enter your username and password."; return; }
    busy(go, "Signing in…");
    const { data, error } = await sb.auth.signInWithPassword({ email: u.includes("@") ? u : u + "@" + EMAIL_DOMAIN, password: pass.value });
    if (error){
      unbusy(go);
      err.textContent = /banned/i.test(error.message) ? "This account has been deactivated. Talk to your administrator."
                      : /Invalid login/i.test(error.message) ? "Wrong username or password." : errText(error);
      return;
    }
    S.session = data.session; await afterLogin();
  };
  app().replaceChildren(h("div",{class:"card auth"},
    h("img",{class:"logo",src:"assets/revive-logo.png",alt:"Revive Health"}),
    h("h1",{text:S.settings.program_name || "Revive Rewards"}),
    h("p",{class:"muted",style:"text-align:center;margin:0 0 6px",text:"Recognize your coworkers. Earn rewards."}), form));
  setTimeout(()=>user.focus(), 50);
}

async function afterLogin(){
  app().replaceChildren(h("div",{class:"empty"}, h("span",{class:"spinner"}), " Loading…"));
  try {
    const me = await q(sb.from("profiles").select("*").eq("id", S.session.user.id).maybeSingle());
    if (!me){ await sb.auth.signOut(); return showLogin("This login isn't linked to an employee profile. Ask your administrator."); }
    if (!me.active){ await sb.auth.signOut(); return showLogin("This account has been deactivated. Talk to your administrator."); }

}

async function loadMine(){

async function loadPosts(n){

async function loadOlder(){

  const rows = await q(sb.from("posts").select("*").lt("created_at", last.created_at).order("created_at",{ascending:false}).limit(31));
  S.hasMore = rows.length > 30; S.posts = S.posts.concat(rows.slice(0,30));

async function loadPostExtras(){
  const ids = S.posts.map(p => p.id);
  if (!ids.length){ S.likes = new Map(); S.comments = new Map(); S.grants = new Map(); return; }
  const [likes, comments, grants] = await Promise.all([
    q(sb.from("likes").select("post_id,user_id").in("post_id", ids)),
    q(sb.from("comments").select("*").in("post_id", ids).order("created_at")),
    q(sb.from("post_points").select("*").in("post_id", ids).order("created_at")),
  ]);
  S.grants = new Map(); for (const g of grants){ if (!S.grants.has(g.post_id)) S.grants.set(g.post_id, []); S.grants.get(g.post_id).push(g); }
  S.likes = new Map(); for (const l of likes){ if (!S.likes.has(l.post_id)) S.likes.set(l.post_id, []); S.likes.get(l.post_id).push(l.user_id); }
  S.comments = new Map(); for (const c of comments){ if (!S.comments.has(c.post_id)) S.comments.set(c.post_id, []); S.comments.get(c.post_id).push(c); }
  const need = S.posts.map(p => p.image_path).filter(p => p && !(S.urls.get(p) && S.urls.get(p).exp > Date.now()));
  if (need.length){
    const { data } = await sb.storage.from("photos").createSignedUrls([...new Set(need)], 3600);
    for (const d of (data || [])) if (d.signedUrl) S.urls.set(d.path, { url:d.signedUrl, exp: Date.now() + 3300e3 });
  }
}

/* ---------- people picker ---------- */
function makePicker(placeholder, onChange, { allowSelf=false } = {}){
  let sel = [], hi = 0, list = [];
  const input = h("input",{placeholder, "aria-label":placeholder, autocomplete:"off"});
  const box = h("div",{class:"box",onclick:()=>input.focus()});
  const dd = h("div",{class:"dd hidden"});
  const el = h("div",{class:"picker"}, box, dd);
  function chips(){
    box.replaceChildren(...sel.map(id => h("span",{class:"chip"}, avatar(id,"av xs"), P(id).full_name,
      h("button",{type:"button","aria-label":"Remove",text:"×",onclick:(e)=>{ e.stopPropagation(); sel = sel.filter(x=>x!==id); chips(); onChange(sel); }}))), input);
  }
  function search(){
    const t = input.value.trim().toLowerCase();
    list = [...S.people.values()].filter(p => p.active && (allowSelf || p.id !== S.me.id) && !sel.includes(p.id) &&
      (!t || p.full_name.toLowerCase().includes(t) || p.username.includes(t) || (p.title||"").toLowerCase().includes(t)))
      .sort((a,b) => (S.facilityFilter && (a.facility===S.facilityFilter) !== (b.facility===S.facilityFilter)) ? (a.facility===S.facilityFilter ? -1 : 1) : a.full_name.localeCompare(b.full_name))
      .slice(0, 12);
    hi = 0; draw();
  }
  function draw(){
    dd.replaceChildren(...(list.length ? list.map((p,i) => h("div",{class: i===hi ? "hi" : "", onmousedown:(e)=>{ e.preventDefault(); pick(p.id); }},
      avatar(p.id,"av sm"), h("div",{style:"min-width:0"}, h("div",{text:p.full_name}), h("div",{class:"small muted ell",text:[p.title,p.facility].filter(Boolean).join(" · ")}))))
      : [h("div",{class:"none",text:"No matches"})]));
    dd.classList.remove("hidden");
  }
  function pick(id){ sel.push(id); input.value = ""; chips(); onChange(sel); input.focus(); search(); }
  input.addEventListener("focus", search); input.addEventListener("input", search);
  input.addEventListener("blur", () => setTimeout(()=>dd.classList.add("hidden"),120));
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown"){ hi = Math.min(list.length-1, hi+1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp"){ hi = Math.max(0, hi-1); draw(); e.preventDefault(); }
    else if (e.key === "Enter"){ if (list[hi]) pick(list[hi].id); e.preventDefault(); }
    else if (e.key === "Backspace" && !input.value && sel.length){ sel.pop(); chips(); onChange(sel); }
    else if (e.key === "Escape"){ dd.classList.add("hidden"); }
  });
  chips();
  return { el, get:()=>[...sel], clear(){ sel = []; chips(); onChange(sel); },
    add(id){ if (!sel.includes(id) && id !== S.me.id){ sel.push(id); chips(); onChange(sel); } } };
}

/* ---------- photos ---------- */
async function compress(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*sc); cv.height = Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(b => r(b), "image/jpeg", 0.85));
  } catch(e){ return null; }
}
async function uploadPhoto(file){
  const blob = await compress(file);
  if (!blob) throw new Error("That photo couldn't be read. Try a JPG or PNG.");
  const path = S.me.id + "/" + crypto.randomUUID() + ".jpg";
  await q(sb.storage.from("photos").upload(path, blob, { contentType:"image/jpeg", upsert:false }));
  return path;
}
function photoInput(state, redraw){

  file.onchange = () => { const f = file.files[0]; file.value = ""; if (!f) return;

    if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
    state.file = f; state.previewUrl = URL.createObjectURL(f); redraw(); };
  return { button: h("button",{class:"btn",type:"button",onclick:()=>file.click()},"📷 Add photo", file),
    preview(){ return state.previewUrl ? h("div",{class:"preview"}, h("img",{src:state.previewUrl,alt:"Photo preview"}),
      h("button",{type:"button","aria-label":"Remove photo",text:"×",onclick:()=>{ URL.revokeObjectURL(state.previewUrl); state.previewUrl=""; state.file=null; redraw(); }})) : ""; } };
}

function parseDate(v){
  if (v === "" || v == null) return null;
  if (v instanceof Date && !isNaN(v)) return { y:v.getFullYear(), m:v.getMonth()+1, d:v.getDate() };
  if (typeof v === "number"){
    if (v < 1 || v > 2958465) return null;
    const dt = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    return { y:dt.getUTCFullYear(), m:dt.getUTCMonth()+1, d:dt.getUTCDate() };
  }
  const t = String(v).trim(); let m;

async function readSheet(f){
  if (f.size > 10 * 1024 * 1024) throw new Error("That file is too big. Save just the staff list and try again.");
  const XLSX = await loadXLSX();
  const wb = XLSX.read(await f.arrayBuffer(), { type:"array", raw:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const grid = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:"", blankrows:false });
  // find the header row within the first 10 rows
  let hi = -1, map = null;
  for (let r = 0; r < Math.min(10, grid.length); r++){
    const m = {}; grid[r].forEach((cell, c) => { const k = normH(cell); for (const [key, names] of Object.entries(HEADERS)) if (names.includes(k) && m[key] == null) m[key] = c; });
    if ((m.first != null && m.last != null) || m.name != null){ hi = r; map = m; break; }
  }
  if (hi < 0) throw new Error("Couldn't find the column headings. The first row should say First Name, Last Name, Birthday, Hire Date, Building.");
  const out = [];
  for (let r = hi + 1; r < grid.length; r++){
    const row = grid[r]; const get = k => map[k] == null ? "" : row[map[k]];
    let first = String(get("first") || "").trim(), last = String(get("last") || "").trim();
    if (!first && !last && map.name != null){
      const n = String(get("name") || "").trim();
      if (n.includes(",")){ [last, first] = n.split(",").map(x => x.trim()); } else { const parts = n.split(/\s+/); first = parts.shift() || ""; last = parts.join(" "); }
    }
    if (!first && !last && !String(get("building")).trim()) continue;   // empty line
    out.push({ line: r + 1, first, last, title:String(get("title") || "").trim(), bdayRaw:get("bday"), hireRaw:get("hire"), buildingRaw:get("building") });
  }
  if (!out.length) throw new Error("The spreadsheet doesn't have any staff rows under the headings.");
  if (out.length > 2000) throw new Error("That's more than 2,000 rows. Split the file into smaller ones.");
  return out;
}

function previewImport(raw, fileName){

  const existingNames = new Map([...S.people.values()].map(p => [normH(p.full_name), p]));

  const missingB = new Set();

    const fullName = (r.first + " " + r.last).replace(/\s+/g, " ").trim();
    out.full_name = fullName.slice(0, 80);
    if (!r.first || !r.last){ out.status = "error"; out.notes.push("Needs both a first and last name"); }
    const key = normH(fullName);
    if (out.status !== "error" && existingNames.has(key)){ out.status = "skip"; out.notes.push("Already has an account (" + existingNames.get(key).username + ")"); }

      h("tbody",{}, rows.slice().sort((a,b) => order[a.status] - order[b.status] || a.line - b.line).map(r => h("tr",{class: r.status === "skip" || r.status === "error" ? "off" : ""},
        h("td",{class:"st",text:icon(r.status)}), h("td",{class:"small muted",text:String(r.line)}),

        h("td",{class:"small"}, r.building || "", r.newBuilding ? h("span",{class:"chip gold",style:"margin-left:4px",text:"new"}) : null),

function rewardForm(r){
  const name = h("input",{class:"input",maxlength:"80",value: r ? r.name : "",placeholder:"e.g. Amazon $25 gift card"});

/* ---- settings ---- */
const isAdminTitle = t => /administrator/i.test(t || "") && !/assistant|in training|\bAIT\b/i.test(t || "");
function autoSender(building){
  const people = [...S.people.values()].filter(p => p.active && p.facility === building);
  const home = /home office/i.test(building);
  const cands = people.filter(p => home ? /owner/i.test(p.title || "") : isAdminTitle(p.title));
  cands.sort((a,b) => (["administrator","owner/operator","owner / operator","owner operator"].includes((b.title||"").trim().toLowerCase()) - ["administrator","owner/operator","owner / operator","owner operator"].includes((a.title||"").trim().toLowerCase()))
    || ((b.role === "admin") - (a.role === "admin")) || String(a.created_at).localeCompare(String(b.created_at)));
  return cands[0] || null;
}
function ownerOperator(){ return [...S.people.values()].filter(p => p.active && /home office/i.test(p.facility || "") && /owner/i.test(p.title || "")).sort((a,b) => String(a.created_at).localeCompare(String(b.created_at)))[0] || null; }
function adminSettings(){
  const name = h("input",{class:"input",maxlength:"60"});
  const cents = h("input",{class:"input",type:"number",min:"0.1",step:"0.1"});
  const vals = h("textarea",{class:"input",style:"min-height:150px"});
  const facs = h("textarea",{class:"input",style:"min-height:110px"});
  const autoOn = h("input",{type:"checkbox"});
  const bday$ = h("input",{class:"input",type:"number",min:"0",step:"1"});
  const anniv$ = h("input",{class:"input",type:"number",min:"0",step:"1"});
  const miles = h("textarea",{class:"input",style:"min-height:110px",placeholder:"5 = 250\n10 = 500"});
  const ptsHint = inp => { const d = h("div",{class:"small muted"}); const u = () => d.textContent = (+inp.value >= 0 && inp.value !== "") ? "= " + Math.round(+inp.value * 100 / (+cents.value || S.settings.point_value_cents)).toLocaleString() + " pts" : ""; inp.addEventListener("input", u); cents.addEventListener("input", u); d._u = u; return d; };
  const bdayHint = ptsHint(bday$), annivHint = ptsHint(anniv$);
  const senderBox = h("div",{style:"display:flex;flex-direction:column;gap:10px"});
  let senderSel = {};
  function drawSenders(){
    const chosen = S.settings.celebration_senders || {};
    senderSel = {};
    const people = [...S.people.values()].filter(p => p.active).sort((a,b) => a.full_name.localeCompare(b.full_name));
    const owner = ownerOperator();
    senderBox.replaceChildren(...(S.settings.facilities || []).map(b => {
      const auto = autoSender(b) || owner;
      const sel = h("select",{class:"input"},
        h("option",{value:"",text:"Automatic: " + (auto ? auto.full_name + (auto.title ? " (" + auto.title + ")" : "") : "Revive Rewards")}),
        h("optgroup",{label:b}, people.filter(p => p.facility === b).map(p => h("option",{value:p.id,text:p.full_name + (p.title ? " (" + p.title + ")" : "")}))),
        h("optgroup",{label:"Everyone else"}, people.filter(p => p.facility !== b).map(p => h("option",{value:p.id,text:p.full_name + (p.title ? " (" + p.title + ")" : "") + (p.facility ? " · " + p.facility : "")}))));
      sel.value = chosen[b] && S.people.has(chosen[b]) ? chosen[b] : "";
      sel.addEventListener("change", () => dirty = true);
      senderSel[b] = sel;
      return h("div",{class:"two",style:"align-items:center"}, h("div",{style:"font-weight:500",text:b}), sel);
    }));
  }
  let dirty = false; [name, cents, vals, facs, autoOn, bday$, anniv$, miles].forEach(x => x.addEventListener("input", () => dirty = true));
  const save = h("button",{class:"btn primary",text:"Save settings"});
  save.onclick = async () => {
    const pc = +cents.value;
    if (!(pc > 0)) return toast("Point value must be more than 0.");
    const lines = t => t.value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 30);
    const ms = {};
    for (const line of lines(miles)){
      const m = line.replace(/[$,]/g, "").match(/^(\d+)\s*(?:years?|yrs?)?\s*[=:\-]\s*(\d+(?:\.\d+)?)$/i);
      if (!m) return toast("Couldn't read milestone line “" + line + "”. Use the form 5 = 250.");
      ms[String(+m[1])] = +m[2];
    }
    if (!(+bday$.value >= 0) || !(+anniv$.value >= 0)) return toast("Celebration amounts must be 0 or more.");
    busy(save, "Saving…");
    try { await q(sb.from("settings").update({ program_name: name.value.trim() || "Revive Rewards", point_value_cents:pc, core_values:lines(vals), facilities:lines(facs),
      auto_awards:autoOn.checked, birthday_dollars:+bday$.value || 0, anniversary_dollars:+anniv$.value || 0, milestone_dollars:ms,
      celebration_senders: Object.fromEntries(Object.entries(senderSel).filter(([,el]) => el.value).map(([b,el]) => [b, el.value])) }).eq("id",1));
      dirty = false; toast("Settings saved"); await refresh(); }
    catch(e){ toast(errText(e)); }

  };

    h("div",{class:"two"},
      h("div",{}, h("label",{class:"f",text:"Program name"}), name),
      h("div",{}, h("label",{class:"f",text:"Value of 1 point, in cents"}), cents, h("div",{class:"small muted",text:"10 means 100 pts = $10"})),
      h("div",{}, h("label",{class:"f",text:"Values staff can tag (one per line)"}), vals),
      h("div",{}, h("label",{class:"f",text:"Buildings (one per line)"}), facs, h("div",{class:"small muted",text:"With more than one, the feed gets a building filter."}))),
    h("h3",{text:"Automatic celebration points",style:"font-size:19px;margin:22px 0 4px"}),
    h("p",{class:"small muted",style:"margin:0 0 10px",text:"Every morning, active employees with a birthday or work anniversary that day get a celebration post in the feed with these points attached. New employees start from the day they're added, with no back-pay for earlier dates."}),
    h("label",{class:"row",style:"gap:8px;cursor:pointer;margin-bottom:10px"}, autoOn, "Give celebration points automatically"),
    h("div",{class:"two"},
      h("div",{}, h("label",{class:"f",text:"Birthday ($)"}), bday$, bdayHint),
      h("div",{}, h("label",{class:"f",text:"Work anniversary, regular years ($)"}), anniv$, annivHint),
      h("div",{}, h("label",{class:"f",text:"Milestone anniversaries (years = dollars, one per line)"}), miles,
        h("div",{class:"small muted",text:"A milestone replaces the regular anniversary amount for that year."}))),
    h("h3",{text:"Who celebration posts come from",style:"font-size:19px;margin:22px 0 4px"}),
    h("p",{class:"small muted",style:"margin:0 0 10px",text:"Automatic uses the person titled Administrator at each building, and the Owner/Operator for Revive Home Office. Administrators' own birthdays and anniversaries always come from the Owner/Operator. Pick someone else if a building's leader has a different title, like Executive Director."}),
    senderBox,
    h("div",{class:"row",style:"margin-top:14px"}, h("span",{class:"sp"}), save));
  el._refresh = () => { if (dirty) return; const s = S.settings;
    name.value = s.program_name; cents.value = String(s.point_value_cents);
    vals.value = (s.core_values||[]).join("\n"); facs.value = (s.facilities||[]).join("\n");
    autoOn.checked = s.auto_awards !== false; bday$.value = String(s.birthday_dollars ?? 25); anniv$.value = String(s.anniversary_dollars ?? 25);
    const md = s.milestone_dollars || {}; miles.value = Object.keys(md).sort((a,b) => +a - +b).map(k => k + " = " + md[k]).join("\n");
    bdayHint._u(); annivHint._u(); drawSenders(); };
  return el;
}
